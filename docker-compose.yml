# =====================================================================
# 本地 / 单机部署示例
#
# 使用前：
#   1. cp .env.example .env
#   2. 编辑 .env，填入你自己的密码与密钥（不要提交 .env）
#   3. docker compose up -d --build
# =====================================================================
services:
  redis:
    image: redis:7-alpine
    container_name: lg-redis
    ports:
      - "127.0.0.1:6379:6379"
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy noeviction
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  mysql:
    image: mysql:8.0
    container_name: lg-mysql
    ports:
      - "127.0.0.1:${MYSQL_HOST_PORT:-13306}:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?请在 .env 中设置 MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-gateway}
      TZ: ${TZ:-Asia/Shanghai}
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    volumes:
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - lg-mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 20

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: lg-rabbitmq
    ports:
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBIT_USER:-gateway}
      RABBITMQ_DEFAULT_PASS: ${RABBIT_PASS:?请在 .env 中设置 RABBIT_PASS}
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 20

  # Mock 上游：模拟 Anthropic / OpenAI / Gemini，供本地联调与压测
  mock-primary:
    build:
      context: .
      dockerfile: Dockerfile.mock
    container_name: lg-mock-primary
    ports:
      - "127.0.0.1:9000:9000"
    environment:
      SERVER_PORT: 9000

  mock-backup:
    build:
      context: .
      dockerfile: Dockerfile.mock
    container_name: lg-mock-backup
    ports:
      - "127.0.0.1:9001:9001"
    environment:
      SERVER_PORT: 9001

  gateway:
    build:
      context: .
      dockerfile: Dockerfile.gateway
    container_name: lg-gateway
    ports:
      - "127.0.0.1:${GATEWAY_PORT:-18081}:18081"
    environment:
      SERVER_PORT: 18081
      REDIS_HOST: redis
      REDIS_PORT: 6379
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_USER: root
      MYSQL_PASS: ${MYSQL_ROOT_PASSWORD}
      RABBIT_HOST: rabbitmq
      RABBIT_USER: ${RABBIT_USER:-gateway}
      RABBIT_PASS: ${RABBIT_PASS}
      # 管理端凭证（必填）
      ADMIN_USERNAME: ${ADMIN_USERNAME:?请在 .env 中设置 ADMIN_USERNAME}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?请在 .env 中设置 ADMIN_PASSWORD}
      ADMIN_JWT_SECRET: ${ADMIN_JWT_SECRET:?请在 .env 中设置 ADMIN_JWT_SECRET}
      # 演示用客户端 Key
      DEMO_API_KEY: ${DEMO_API_KEY:-sk-lg-demo-key-local}
      # 上游地址
      UPSTREAM_BASE_URL: http://mock-primary:9000
      UPSTREAM_BACKUP_URL: http://mock-backup:9001
      UPSTREAM_OPENAI_URL: http://mock-primary:9000
      UPSTREAM_GEMINI_URL: http://mock-primary:9000
      TZ: ${TZ:-Asia/Shanghai}
    depends_on:
      redis:
        condition: service_healthy
      mysql:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      mock-primary:
        condition: service_started
      mock-backup:
        condition: service_started

volumes:
  lg-mysql-data:
